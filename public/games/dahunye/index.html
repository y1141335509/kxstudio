<body>
<div id="stage">
  <div class="top-bar">
    <div style="grid-column:1;justify-self:start;display:flex;align-items:center;gap:2px;">
      <a href="/games" class="back-btn" style="text-decoration:none;">← 游戏列表</a>
      <button id="backBtn" class="back-btn" onclick="goBack()" hidden>↶ 上一步</button>
    </div>
    <div class="chapter-tag" id="chapterTag">大婚之夜</div>
    <button id="muteBtn" class="mute-btn" onclick="toggleMute()">🔊</button>
  </div>
  <div id="app"></div>
  <audio id="bgm" loop></audio>
</div>

<script>
var TRACKS = { calm: "bgm-calm.mp3", romantic: "bgm-romantic.mp3" };
var audioStarted = false;
var currentTrackKey = null;
var bgmEl = null;

function ensureAudioStarted() {
  if (bgmEl) return;
  audioStarted = true;
  bgmEl = document.getElementById('bgm');
  bgmEl.volume = 0.32;
}

function attemptPlay() {
  if (bgmEl && bgmEl.paused) bgmEl.play().catch(function () {});
}

function switchTrack(key) {
  ensureAudioStarted();
  if (currentTrackKey === key) { attemptPlay(); return; }
  if (currentTrackKey === null) {
    // first-ever start: set src and play synchronously within this call,
    // so it can ride whatever gesture context triggered it (no fade delay,
    // which would otherwise break the gesture chain and get blocked).
    currentTrackKey = key;
    bgmEl.src = TRACKS[key];
    attemptPlay();
    return;
  }
  currentTrackKey = key;
  var fadeOut = setInterval(function () {
    if (bgmEl.volume > 0.03) { bgmEl.volume -= 0.03; }
    else {
      clearInterval(fadeOut);
      bgmEl.src = TRACKS[key];
      bgmEl.volume = 0;
      attemptPlay();
      var fadeIn = setInterval(function () {
        if (bgmEl.volume < 0.29) { bgmEl.volume += 0.03; }
        else { bgmEl.volume = 0.32; clearInterval(fadeIn); }
      }, 60);
    }
  }, 60);
}

function toggleMute() {
  ensureAudioStarted();
  bgmEl.muted = !bgmEl.muted;
  document.getElementById('muteBtn').textContent = bgmEl.muted ? '🔇' : '🔊';
}

function scrollTop() {
  window.scrollTo(0, 0);
  requestAnimationFrame(function () {
    window.scrollTo(0, 0);
    requestAnimationFrame(function () { window.scrollTo(0, 0); });
  });
}

var CG = {
  jiejian: "cg1-jiejian.jpg",
  xinsi: "cg2-xinsi.jpg",
  cuoguo: "cg3-cuoguo.jpg",
  zhishaocike: "cg4-zhishaocike.jpg",
  shenxun: "cg5-shenxun.jpg"
};

var hexagrams = [
  { symbol: "䷉", name: "履卦", judge: "履虎尾，不咥人，亨。", reading: "如履薄冰，说的原来是这个卦——脚下踩着老虎尾巴，却还能平安无事，靠的不是运气，是每一步都走得小心又坚定。你心里越是发怵，就越说明你在乎这件事的结果；可越是这种时候，越不能停在原地。不敢往前，才是真的危险。" },
  { symbol: "䷊", name: "泰卦", judge: "小往大来，吉，亨。", reading: "天地交而万物通，说的是上下心意能顺利流通的意思。今日抽到这一卦，是难得的好兆头：你可能担心说出口会打破眼前的平静，其实恰恰相反——越是压着不说，事情才越容易憋出问题。该说的话，趁着这股顺劲说出口，反而水到渠成。" },
  { symbol: "䷋", name: "否卦", judge: "否之匪人，不利君子贞。", reading: "否卦是泰卦的反面，闭塞不通之象——不是没有心意，是心意暂时递不过去。今日若有话堵在嘴边没说出口，不必强求，先咽下去也无妨。不是不说，是这句话还没到能被好好听见的时候。忍一时的憋闷，好过说了却被辜负。" },
  { symbol: "䷞", name: "咸卦", judge: "咸，亨，利贞，取女吉。", reading: "咸者，感也，两心相感，不言而喻——是那种不用把话说透，对方也大概明白你在想什么的默契。这一卦最宜示好，也最宜表白心迹：你若藏着一点心事，今天说出来，成功的概率比平时都高。错过这个时机，可能要再等很久。" },
  { symbol: "䷟", name: "恒卦", judge: "恒，亨，无咎，利贞。", reading: "恒者，久也——这一卦说的不是轰轰烈烈，而是能不能扛得住时间。一时的冷淡、一句没说透的话，都不必慌，感情这件事，从来不是靠一夜之间的表白或误会就能定下结局的。真正长久的东西，往往是熬出来的，不是抢出来的。" },
  { symbol: "䷥", name: "睽卦", judge: "睽，小事吉。", reading: "睽者，乖也——两个人站得很近，心却在悄悄地渐行渐远，是那种“明明什么都没说破，却觉得不对劲”的状态。抽到这一卦，是个提醒：该主动一点了，别总等对方先低头。你多问一句，可能就把正在拉开的距离，重新拉回来了。" },

function pickVariant(endingKey, score) {
  var list = REPORT_VARIANTS[endingKey];
  for (var i = 0; i < list.length; i++) {
    if (score <= list[i].max) return list[i];
  }
  return list[list.length - 1];
}

var READY_VARIANTS = ['A', 'B', 'C'];
var VARIANT = (function () {
  var m = /[?&]v=([ABC])/.exec(location.search);
  if (m) return m[1];
  try { var saved = sessionStorage.getItem('dahunye_variant'); if (saved && READY_VARIANTS.indexOf(saved) >= 0) return saved; } catch (e) {}
  var v = READY_VARIANTS[Math.floor(Math.random() * READY_VARIANTS.length)];
  try { sessionStorage.setItem('dahunye_variant', v); } catch (e) {}
  return v;
})();

}

var T0 = Date.now();
var screensSeen = 0;
function secs() { return Math.round((Date.now() - T0) / 1000); }

  screensSeen++;

}
var lastLeaveScreen = null;
function trackLeave() {
  if (lastLeaveScreen === current) return;
  lastLeaveScreen = current;
  ga('leave', { game_id: 'dahunye', screen_id: (B_SCENES[current] ? current + '#' + bIndex : current), screen_depth: screensSeen, seconds: secs(), transport_type: 'beacon' });
}

function renderCurrent() {
  if (MUSIC_CUES[current]) switchTrack(MUSIC_CUES[current]);
  else attemptPlay();
  if (current === 'report') {
    renderReport();
  } else if (current.indexOf('endcg:') === 0) {
    renderEndingCG(current.slice(6));
  } else if (current.indexOf('end:') === 0) {
    renderEnding(current.slice(4));
  } else {
    document.getElementById('app').innerHTML = SCREENS[current]();
  }
  document.getElementById('backBtn').hidden = navStack.length === 0;
  scrollTop();
  trackScreen();
}

function goto(id) {
  navStack.push(current);
  current = id;
  renderCurrent();
}

function goBack() {
  if (!navStack.length) return;
  current = navStack.pop();
  renderCurrent();
}

  html += '<div class="sub-choices" id="subChoices" hidden onclick="event.stopPropagation()">';
  if (sc.choice) {
    if (sc.choice.meta) html += '<div class="sub-meta">' + sc.choice.meta + '</div>';
    if (sc.choice.prompt) html += '<p class="sub-prompt">' + sc.choice.prompt + '</p>';
    for (var i = 0; i < sc.choice.opts.length; i++) html += '<button class="sub-btn" onclick="bChoose(' + i + ')">' + sc.choice.opts[i][0] + '</button>';
  } else if (sc.ending) {
    html += '<button class="sub-btn" onclick="goto(\'end:' + sc.ending + '\')">查看结局 →</button>';
  }

  html += '<div class="recap-panel" id="recapPanel" hidden onclick="closeRecap()"><div class="recap-inner" onclick="event.stopPropagation()">';

}

function showSubLine() {
  var sc = B_SCENES[current];
  var el = document.getElementById('subLine');
  if (!sc || !el) return;
  var l = sc.lines[bIndex];
  var stage = document.getElementById('subStage');
  if (stage) stage.classList.toggle('sub-cg', l[0] === 'cg');
  var dlg = document.getElementById('subDlg'), nm = document.getElementById('subName');
  dlg.hidden = l[0] === 'cg';
  nm.hidden = l[0] === 'narr' || l[0] === 'cg';
  nm.className = 'dlg-name ' + l[0];
  nm.textContent = l[0] === 'zheng' ? '政' : (l[0] === 'ni' ? '你' : '');
  el.className = 'dlg-text ' + l[0];
  el.innerHTML = l[0] === 'cg' ? '' : l[1];
  document.getElementById('subHint').hidden = false;
  document.getElementById('cgHint').hidden = l[0] !== 'cg';
  clearTimeout(bTimer);
  var last = bIndex >= sc.lines.length - 1;
  if (last && (sc.choice || sc.ending)) {
    document.getElementById('subHint').hidden = true;
    bTimer = setTimeout(function () {
      var c = document.getElementById('subChoices');
      if (c && B_SCENES[current] === sc) c.hidden = false;
    }, 500);
  } else if (sc.auto && bIndex < sc.auto) {
    bTimer = setTimeout(advanceSub, 1200);
  }
}
function advanceSub() {
  var sc = B_SCENES[current];
  if (!sc) return;
  if (bIndex < sc.lines.length - 1) { bIndex++; showSubLine(); }
  else if (sc.next) goto(sc.next);
}
function bChoose(i) {
  var o = B_SCENES[current].choice.opts[i];
  recordChoice(o[1], o[2]);
  if (o[3].indexOf('end:') === 0) {
    var key = o[3].slice(4);
    state.ending = key;
    ga('complete', { game_id: 'dahunye', ending: key });
    goto('b_end_' + key);
  } else {
    goto(o[3]);
  }
}
document.addEventListener('keydown', function (e) {
  if (!B_SCENES[current]) return;
  var c = document.getElementById('subChoices'), r = document.getElementById('recapPanel');
  if ((c && !c.hidden) || (r && !r.hidden)) return;
  if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight') { e.preventDefault(); advanceSub(); }
});
function openRecap() {
  clearTimeout(bTimer);
  document.getElementById('recapPanel').hidden = false;

}
function closeRecap() {
  document.getElementById('recapPanel').hidden = true;
  showSubLine();
}
