<script>
var TRACKS = { calm: "bgm-calm.mp3", romantic: "bgm-romantic.mp3" };
var audioStarted = false;
var currentTrackKey = null;
var bgmEl = null;

function ensureAudioStarted() {
  if (bgmEl) return;
  audioStarted = true;
  bgmEl = document.getElementById('bgm');
  bgmEl.volume = 0.32;
}

function attemptPlay() {
  if (bgmEl && bgmEl.paused) bgmEl.play().catch(function () {});
}

function switchTrack(key) {
  ensureAudioStarted();
  if (currentTrackKey === key) { attemptPlay(); return; }
  if (currentTrackKey === null) {
    // first-ever start: set src and play synchronously within this call,
    // so it can ride whatever gesture context triggered it (no fade delay,
    // which would otherwise break the gesture chain and get blocked).
    currentTrackKey = key;
    bgmEl.src = TRACKS[key];
    attemptPlay();
    return;
  }
  currentTrackKey = key;
  var fadeOut = setInterval(function () {
    if (bgmEl.volume > 0.03) { bgmEl.volume -= 0.03; }
    else {
      clearInterval(fadeOut);
      bgmEl.src = TRACKS[key];
      bgmEl.volume = 0;
      attemptPlay();
      var fadeIn = setInterval(function () {
        if (bgmEl.volume < 0.29) { bgmEl.volume += 0.03; }
        else { bgmEl.volume = 0.32; clearInterval(fadeIn); }
      }, 60);
    }
  }, 60);
}

function toggleMute() {
  ensureAudioStarted();
  bgmEl.muted = !bgmEl.muted;
  document.getElementById('muteBtn').textContent = bgmEl.muted ? '🔇' : '🔊';
}

function scrollTop() {
  window.scrollTo(0, 0);
  requestAnimationFrame(function () {
    window.scrollTo(0, 0);
    requestAnimationFrame(function () { window.scrollTo(0, 0); });
  });
}

function pickVariant(endingKey, score) {
  var list = REPORT_VARIANTS[endingKey];
  for (var i = 0; i < list.length; i++) {

  }
  return list[list.length - 1];
}

var MUSIC_CUES = { s0: 'calm', s1b: 'romantic', report: 'calm' };

function renderCurrent() {
  if (MUSIC_CUES[current]) switchTrack(MUSIC_CUES[current]);
  else attemptPlay();
  if (current === 'report') {
    renderReport();
  } else if (current.indexOf('endcg:') === 0) {
    renderEndingCG(current.slice(6));
  } else if (current.indexOf('end:') === 0) {
    renderEnding(current.slice(4));
  } else {
    document.getElementById('app').innerHTML = SCREENS[current]();
  }
  document.getElementById('backBtn').hidden = navStack.length === 0;
  scrollTop();
}

function goto(id) {
  navStack.push(current);
  current = id;
  renderCurrent();
}

function goBack() {
  if (!navStack.length) return;
  current = navStack.pop();
  renderCurrent();
}

function restart() {
  navStack = [];
  current = 's0';
  state.choices = {};
  renderCurrent();
}

function showEnding(key) {
  state.ending = key;
  navStack.push(current);
  current = 'endcg:' + key;
  ga('complete', { game_id: 'dahunye', ending: key });
  renderCurrent();
}

function renderEndingCG(key) {

function showReport() {
  navStack.push(current);
  current = 'report';

function renderReport() {
  var e = ENDINGS[state.ending];
  var score = computeScore();
  var variant = pickVariant(state.ending, score);
  var toneClass = e.tone === 'he' ? 'he-tone' : 'be-tone';
  var html = '<div class="fade-in">';
  html += '<div class="comp-eyebrow">通关</div><div class="comp-title">你的结局报告</div>';
  html += '<div class="quiz-card ' + toneClass + '">';
  html += '<div class="quiz-tag">' + variant.name + '</div>';
  html += '<div class="quiz-choice">' + e.quizChoice + '</div>';
  html += '<div class="quiz-poem">「' + variant.poem + '」</div>';
  html += '<div class="quiz-poem-src">' + variant.poemSrc + '</div>';
  html += '<p class="quiz-body">' + variant.body + '</p>';

  var sideNotes = [];
  for (var i = 0; i < FLAVOR_ORDER.length; i++) {
    var k = FLAVOR_ORDER[i];
    var v = state.choices[k];
    if (v && FLAVOR_LINES[k] && FLAVOR_LINES[k][v]) sideNotes.push(FLAVOR_LINES[k][v]);
  }
  if (sideNotes.length) {
    html += '<p class="quiz-extra">往前翻一翻你的选择——' + sideNotes.join(' ') + '</p>';
  }
  html += '</div>';

  html += '<div class="divination">';
  html += '<div class="div-title">你的今日占卜</div>';
  html += '<div id="stalksView"><div class="div-sub">一把蓍草，摇一摇，起一卦</div>';
  html += '<svg class="stalks-svg" id="stalksSvg" viewBox="0 0 120 120" role="img" aria-label="一束蓍草"><line x1="40" y1="102" x2="34" y2="18" /><line x1="48" y1="104" x2="45" y2="12" /><line x1="56" y1="105" x2="56" y2="8" /><line x1="64" y1="104" x2="67" y2="13" /><line x1="72" y1="102" x2="78" y2="20" /><line x1="60" y1="105" x2="60" y2="6" /><line x1="52" y1="103" x2="50" y2="16" /><path d="M30,96 Q60,88 90,96" stroke-width="3.4" /></svg>';
  html += '<button class="draw-btn" onclick="shakeStalks()">摇一摇</button></div>';
  html += '<div id="resultView" hidden><div class="div-symbol" id="hexSymbol">䷉</div><div class="div-name" id="hexName">履卦</div><div class="div-line" id="hexJudge"></div><div class="div-reading" id="hexReading"></div><button class="draw-btn" onclick="resetDivination()">再摇一次</button></div>';
  html += '</div>';

  html += '<div class="action-bar"><div class="restart-row"><button class="restart-btn" onclick="restart()">重新开始</button></div></div>';
  html += '</div>';
  document.getElementById('app').innerHTML = html;
}

function shakeStalks() {
  var svg = document.getElementById('stalksSvg');
  svg.classList.remove('shaking'); void svg.offsetWidth; svg.classList.add('shaking');
  setTimeout(function () {
    var h = hexagrams[Math.floor(Math.random() * hexagrams.length)];
    document.getElementById('hexSymbol').textContent = h.symbol;
    document.getElementById('hexName').textContent = h.name;
    document.getElementById('hexJudge').textContent = h.judge;
    document.getElementById('hexReading').textContent = h.reading;
    document.getElementById('stalksView').hidden = true;
    document.getElementById('resultView').hidden = false;
  }, 550);
}
function resetDivination() {
  document.getElementById('resultView').hidden = true;
  document.getElementById('stalksView').hidden = false;
}
