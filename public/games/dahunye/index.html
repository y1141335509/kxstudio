<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>大婚之夜 · 纸上秦互动版</title>
</head>
<body>
<style>
  :root{
    --bg:#12080A;
    --bg-panel:#1C0F12;
    --line:#4A2530;
    --text:#F3E6D8;
    --text-dim:#B08A7A;
    --accent:#C9A24B;
    --accent-glow:#E8C978;
    --seal:#8C1F28;
    --font-display:'Songti SC','STSong','Noto Serif SC',serif;
    --font-body:-apple-system,'PingFang SC','Hiragino Sans GB','Helvetica Neue',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
    overflow-x:hidden;
  }

  .stage{
    position:relative;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
    isolation:isolate;
  }
  .stage::before{
    content:'';
    position:absolute;
    top:-10%;
    left:50%;
    transform:translateX(-50%);
    width:120vw;
    height:70vh;
    background:radial-gradient(ellipse at center, rgba(201,162,75,0.14), rgba(140,31,40,0.05) 45%, transparent 70%);
    pointer-events:none;
    z-index:0;
  }

  .panel{
    position:relative;
    z-index:1;
    width:100%;
    max-width:460px;
  }

  .eyebrow{
    font-size:11px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--text-dim);
    text-align:center;
    margin-bottom:10px;
  }

  .cover-frame{
    position:relative;
    width:100%;
    max-width:280px;
    margin:0 auto 22px;
    border-radius:6px;
    overflow:hidden;
    border:1px solid var(--line);
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
  }
  .cover-frame img{
    display:block;
    width:100%;
    height:auto;
    filter:saturate(0.9) contrast(1.05);
  }
  .cover-frame::after{
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, transparent 55%, rgba(18,8,10,0.85) 100%);
  }

  .title-block{
    text-align:center;
    padding:8px 0 6px;
  }
  .title-block h1{
    font-family:var(--font-display);
    font-weight:600;
    font-size:32px;
    letter-spacing:0.1em;
    color:var(--text);
    text-wrap:balance;
    margin-bottom:12px;
  }
  .title-block p{
    font-size:13px;
    color:var(--text-dim);
    line-height:1.8;
    max-width:280px;
    margin:0 auto 30px;
  }

  .btn{
    font-family:var(--font-body);
    font-size:14px;
    letter-spacing:0.05em;
    color:var(--text);
    background:transparent;
    border:1px solid var(--accent);
    border-radius:3px;
    padding:12px 20px;
    cursor:pointer;
    transition:background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:hover{ background:rgba(201,162,75,0.12); }
  .btn:focus-visible{ outline:2px solid var(--accent-glow); outline-offset:2px; }
  .btn.primary{
    display:block;
    margin:0 auto;
    background:var(--accent);
    border-color:var(--accent);
    color:#1C0F12;
    font-weight:600;
    padding:12px 32px;
  }
  .btn.primary:hover{ background:var(--accent-glow); border-color:var(--accent-glow); }

  .story-card{
    background:linear-gradient(180deg, var(--bg-panel), rgba(28,15,18,0.6));
    border:1px solid var(--line);
    border-radius:4px;
    padding:34px 28px 28px;
    min-height:180px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    cursor:pointer;
  }
  .story-card.no-tap{ cursor:default; }
  .story-card.with-cg{ cursor:pointer; padding:0; overflow:hidden; }

  .cg-image{
    width:100%;
    display:block;
    max-height:340px;
    object-fit:cover;
    object-position:top center;
    filter:saturate(0.92);
  }
  .cg-text-wrap{ padding:22px 24px 24px; }

  .story-text{
    font-size:16.5px;
    line-height:2;
    color:var(--text);
    text-wrap:balance;
    animation: fade-up 0.55s ease both;
  }
  .story-text.dim{ color:var(--text-dim); font-style:italic; }
  .story-text.final{
    font-family:var(--font-display);
    font-size:18px;
    line-height:2.1;
  }

  @keyframes fade-up{
    from{ opacity:0; transform:translateY(6px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @media (prefers-reduced-motion: reduce){
    .story-text{ animation:none; }
  }

  .continue-cue{
    display:flex;
    justify-content:flex-end;
    margin-top:22px;
    color:var(--accent);
    font-size:13px;
    letter-spacing:0.05em;
  }
  .continue-cue .mark{
    display:inline-block;
    margin-left:6px;
    animation: nudge 1.6s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce){
    .continue-cue .mark{ animation:none; }
  }
  @keyframes nudge{
    0%,100%{ transform:translateX(0); opacity:0.6; }
    50%{ transform:translateX(4px); opacity:1; }
  }

  .choice-prompt{
    font-size:15px;
    color:var(--text-dim);
    margin-bottom:16px;
    line-height:1.75;
  }
  .choices{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .choice-btn{
    font-family:var(--font-body);
    text-align:left;
    font-size:15px;
    color:var(--text);
    background:rgba(243,230,216,0.03);
    border:1px solid var(--line);
    border-radius:3px;
    padding:13px 16px;
    cursor:pointer;
    transition:border-color 0.2s ease, background 0.2s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .choice-btn:hover{ border-color:var(--accent); background:rgba(201,162,75,0.08); }
  .choice-btn:focus-visible{ outline:2px solid var(--accent-glow); outline-offset:2px; }

  .end-block{ text-align:center; }
  .end-mark{
    font-family:var(--font-display);
    color:var(--text-dim);
    font-size:12px;
    letter-spacing:0.3em;
    margin-top:26px;
    margin-bottom:22px;
  }
  .restart{
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:12px;
    letter-spacing:0.04em;
    text-decoration:underline;
    text-underline-offset:3px;
    cursor:pointer;
  }
  .restart:hover{ color:var(--accent); }

  .kx-mark{
    text-align:center;
    font-size:10px;
    letter-spacing:0.15em;
    color:var(--text-dim);
    margin-top:26px;
    opacity:0.7;
  }

  @media (max-width:380px){
    .title-block h1{ font-size:26px; }
    .story-card{ padding:26px 20px 22px; }
  }
</style>

<div class="stage" id="stage">
  <div class="panel" id="panel"></div>
</div>

  function renderBeat(beat){
    panel.innerHTML = '';

    if (beat.type === 'choice'){
      const card = document.createElement('div');
      card.className = 'story-card no-tap';
      const prompt = document.createElement('div');
      prompt.className = 'choice-prompt';
      prompt.style.whiteSpace = 'pre-line';
      prompt.textContent = beat.prompt;
      card.appendChild(prompt);

      const choices = document.createElement('div');
      choices.className = 'choices';
      beat.options.forEach(opt => {
        const b = document.createElement('button');
        b.className = 'choice-btn';
        b.textContent = opt.label;
        b.onclick = () => {
          state[beat.key] = opt.value;
          advance();
        };
        choices.appendChild(b);
      });
      card.appendChild(choices);
      panel.appendChild(card);
      return;
    }

    if (beat.type === 'cg'){
      const card = document.createElement('div');
      card.className = 'story-card with-cg';
      const img = document.createElement('img');
      img.className = 'cg-image';
      img.src = cgSources[beat.image];
      img.alt = '';
      card.appendChild(img);
      const textWrap = document.createElement('div');
      textWrap.className = 'cg-text-wrap';
      const text = document.createElement('div');
      text.className = 'story-text';
      text.textContent = beat.text;
      textWrap.appendChild(text);
      const cue = document.createElement('div');
      cue.className = 'continue-cue';
      cue.innerHTML = '继续<span class="mark">\u25B8</span>';
      textWrap.appendChild(cue);
      card.appendChild(textWrap);
      card.onclick = advance;
      panel.appendChild(card);
      return;
    }

    const isFinal = beat.type === 'final';
    const text = document.createElement('div');
    text.className = 'story-text' + (beat.dim ? ' dim' : '') + (isFinal ? ' final' : '');
    text.style.whiteSpace = 'pre-line';
    text.textContent = typeof beat.text === 'function' ? beat.text(state) : beat.text;

    const card = document.createElement('div');
    card.className = 'story-card' + (isFinal ? ' no-tap' : '');
    card.appendChild(text);

    if (isFinal){
      panel.appendChild(card);
      const mark = document.createElement('div');
      mark.className = 'end-mark';
      mark.textContent = '完';
      mark.style.textAlign = 'center';
      panel.appendChild(mark);

      const restart = document.createElement('button');
      restart.className = 'restart';
      restart.textContent = '再读一遍，做不同的选择';
      restart.style.display = 'block';
      restart.style.margin = '0 auto 4px';
      restart.onclick = () => { i = -1; state.fear = null; state.gift = null; renderTitle(); };
      panel.appendChild(restart);

      const kx = document.createElement('div');
      kx.className = 'kx-mark';
      kx.textContent = 'KXStudio · 修史馆系列 · 纸上秦';
      panel.appendChild(kx);
      return;
    }

    const cue = document.createElement('div');
    cue.className = 'continue-cue';
    cue.innerHTML = '继续<span class="mark">\u25B8</span>';
    card.appendChild(cue);
    card.onclick = advance;

    panel.appendChild(card);
  }

  function advance(){
    i++;
    if (i >= beats.length){ return; }
    renderBeat(beats[i]);
  }

  renderTitle();
})();
</script>

</body>
</html>
